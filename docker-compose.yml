version: '3'

services:
  postgres:
    image: postgres:16
    container_name: certo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: certo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - certo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # mailhog:
  #   image: mailhog/mailhog:latest
  #   container_name: certo_mailhog
  #   restart: unless-stopped
  #   ports:
  #     - "1025:1025"  # SMTP server
  #     - "8025:8025"  # Web UI
  #   networks:
  #     - certo-network

  backend:
    build:
      context: ./src/backend
    container_name: certo_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # mailhog:
      #   condition: service_started
    # env_file:
    #   - ./src/backend/.env
    labels:                    # ADD: whole block
      - traefik.enable=true
      - traefik.http.routers.bootcamp-backend-web.rule=Host(`bootcamp-api.labspk.com`)
      - traefik.http.routers.bootcamp-backend-web.entrypoints=web
      - traefik.http.routers.bootcamp-backend-web.service=bootcamp-backend-service
      - traefik.http.routers.bootcamp-backend-websecure.rule=Host(`bootcamp-api.labspk.com`)
      - traefik.http.routers.bootcamp-backend-websecure.entrypoints=websecure
      - traefik.http.routers.bootcamp-backend-websecure.tls=true
      - traefik.http.routers.bootcamp-backend-websecure.service=bootcamp-backend-service
      - traefik.http.services.bootcamp-backend-service.loadbalancer.server.port=1337
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      # Production by default. Two things follow from this: Strapi stops
      # returning internal error detail (raw SQL, stack traces) to API
      # clients, and bootstrap/seed-data.ts refuses to seed the
      # admin@certo.com/certo account - whose password is published in the
      # upstream README - into a fresh database. Override with NODE_ENV in a
      # root .env if you want development behaviour locally.
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_CLIENT: ${DATABASE_CLIENT:-postgres}
      DATABASE_HOST: $:{DATABASE_HOST:-postgres}
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-certo}
      DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-your-admin-jwt-secret}
      APP_KEYS: ${APP_KEYS:-your-app-keys}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-your-api-token-salt}
      # Used to encrypt per-issuer private signing keys at rest (see
      # src/backend/src/utils/key-encryption.ts). Dev-only default - generate
      # your own for production!
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-oM/e09YZzP6Pz9gNkS5Y2w==}
      # Legacy: was the single shared signing key before per-issuer keys
      # (issuer-key content type) were introduced. No longer read by the
      # signing/verification code paths; kept only so old container envs
      # referencing it don't error.
      ED25519_PRIVATE_KEY_PKCS8: ${ED25519_PRIVATE_KEY_PKCS8:-LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCk1DNENBUUF3QlFZREsyVndCQ0lFSUFISG5RZ0tlSitZMFFMMlhTbTRQZUxZdUxPWVRaY3NXSDVlR3hLQ3JoUi8KLS0tLS1FTkQgUFJJVkFURSBLRVktLS0tLQo=}
      # SMTP_HOST/PORT/USERNAME/PASSWORD/FROM/REPLY_TO now come from
      # src/backend/.env via env_file above (real Hostinger SMTP, not
      # Mailhog) - removed the mailhog hardcode that used to live here.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:1337}
    ports:
      - "1337:1337"
    volumes:
      # Without this, uploaded media (achievement/profile images) lives only
      # in the container's writable layer and is silently lost on every
      # `docker-compose up --build`/container recreation. Also what
      # scripts/backup.js and scripts/restore.js read/write - see
      # docs/self-hosting.md.
      
      - uploads-data:/app/public/uploads
      
      # Bind mount, not a named volume: scripts/backup.js writes to
      # /app/backups, which without this is the container's writable layer -
      # every `docker compose up --build` would silently destroy every
      # backup taken since the last one. A host directory also means you can
      # copy dumps off this machine without going through Docker, which is
      # the point of having them.
      
      - ./backups:/app/backups
    networks:
      - certo-network

  frontend:
    build:
      context: ./src/frontend
    container_name: certo_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NUXT_PUBLIC_API_URL: https://bootcamp-api.labspk.com
    ports:
      - "3399:3000"
    networks:
      - certo-network
    labels:                    # ADD: whole block
      - traefik.enable=true
      - traefik.http.routers.bootcamp-frontend-web.rule=Host(`bootcamp.labspk.com`)
      - traefik.http.routers.bootcamp-frontend-web.entrypoints=web
      - traefik.http.routers.bootcamp-frontend-web.service=bootcamp-frontend-service
      - traefik.http.routers.bootcamp-frontend-websecure.rule=Host(`bootcamp.labspk.com`)
      - traefik.http.routers.bootcamp-frontend-websecure.entrypoints=websecure
      - traefik.http.routers.bootcamp-frontend-websecure.tls=true
      - traefik.http.routers.bootcamp-frontend-websecure.service=bootcamp-frontend-service
      - traefik.http.services.bootcamp-frontend-service.loadbalancer.server.port=3000


networks:
  certo-network:
    driver: bridge

volumes:
  postgres-data:
  uploads-data: 
