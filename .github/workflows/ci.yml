name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 'src/backend/package-lock.json'

      - name: Install dependencies
        working-directory: src/backend
        run: npm ci

      - name: Type-check
        working-directory: src/backend
        run: npx tsc --noEmit

      - name: Test
        working-directory: src/backend
        run: npm test

      - name: Build
        working-directory: src/backend
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 'src/frontend/package-lock.json'

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Lint
        working-directory: src/frontend
        run: npm run lint

      - name: Test
        working-directory: src/frontend
        run: npm run test:unit

      - name: Build
        working-directory: src/frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 'src/frontend/package-lock.json'

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      # chromium only: these are page-render smoke tests, so a second engine
      # doubles the browser download without adding coverage. playwright.config.ts
      # also defines firefox - add it here if a rendering difference ever matters.
      - name: Install Playwright browser
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: src/frontend
        run: npm run test:e2e -- --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/playwright-report/
          retention-days: 7

  # The only job that issues a certificate. The unit suites cover the pieces
  # and the Playwright job checks that pages render; between them sit the
  # routes, the permission config, the middleware, the signature, the status
  # list and the PDF, and nothing exercised those until this. Every bug it has
  # caught so far was invisible to a green suite - see scripts/smoke-flow.js.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compose declares this as an env_file, and it is gitignored - the
      # example carries development values, which is what this stack wants.
      - name: Create the env file compose expects
        run: cp src/backend/.env.example src/backend/.env

      # NODE_ENV=development so bootstrap/seed-data.ts creates the
      # admin@certo.com issuer the script logs in as. The default is
      # production, which deliberately refuses to seed it.
      - name: Start postgres and the backend
        run: docker compose up -d --build postgres backend
        env:
          NODE_ENV: development

      - name: Wait for the API
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:1337/api/health > /dev/null; then
              echo "up"
              exit 0
            fi
            sleep 5
          done
          echo "the API never came up"
          exit 1

      # Bare node, no install: the script has no dependencies.
      - name: Walk the certificate flow
        run: node src/backend/scripts/smoke-flow.js

      - name: Backend logs
        if: failure()
        run: docker compose logs backend
